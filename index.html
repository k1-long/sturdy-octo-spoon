<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Converter · 像素转换机</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown/dist/turndown.js"></script>
  <style>
    :root {
      --shell: #f2ead8;
      --shell-dark: #d6c9b2;
      --shell-shadow: #9a8a6e;
      --screen-bg: #0d0d12;
      --screen-glow: #ffcc00;
      --btn-a: #c40012;
      --btn-a-shadow: #8f0910;
      --btn-gold: #ffcc00;
      --btn-gold-shadow: #b8920a;
      --text-light: #e8e8e8;
      --text-dim: #8a8a9a;
      --pixel: 'Press Start 2P', 'Courier New', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at center, #1a0e2e, #0a0a12);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
    }

    /* ===== 主机外壳 ===== */
    .console {
      max-width: 860px;
      width: 100%;
      background: linear-gradient(170deg, var(--shell), var(--shell-dark));
      border-radius: 28px 28px 20px 20px;
      padding: 20px 20px 16px;
      box-shadow:
        0 16px 48px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.5),
        0 0 30px rgba(255,204,0,0.1);
      border: 2px solid var(--shell-shadow);
      border-top: 6px solid var(--btn-a);
    }

    /* ===== 标题 ===== */
    .header {
      text-align: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--shell-shadow);
    }
    .header h1 {
      font-family: var(--pixel);
      font-size: 0.85rem;
      color: var(--btn-a);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.08);
      letter-spacing: 2px;
      line-height: 1.6;
    }
    .header .subtitle {
      font-family: var(--pixel);
      font-size: 0.6rem;
      color: #7a5a00;
      letter-spacing: 4px;
      display: block;
      margin-top: 6px;
    }
    .header .badge {
      display: inline-block;
      font-family: var(--pixel);
      font-size: 0.5rem;
      color: var(--btn-gold);
      background: var(--btn-a);
      border: 2px solid var(--btn-gold);
      border-radius: 6px;
      padding: 4px 8px;
      margin-bottom: 8px;
      letter-spacing: 1px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }

    /* ===== 主体容器 ===== */
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ===== 屏幕区域 ===== */
    .screen-area {
      background: var(--screen-bg);
      border: 3px solid #2a2a35;
      border-radius: 12px;
      padding: 8px;
      position: relative;
      box-shadow: inset 0 0 20px rgba(255,204,0,0.06), 0 2px 8px rgba(0,0,0,0.3);
    }
    .screen-label {
      font-family: var(--pixel);
      font-size: 0.5rem;
      color: var(--screen-glow);
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255,204,0,0.4);
    }

    /* 扫描线 */
    .screen-area::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      border-radius: 10px;
    }
    /* 屏幕发光边框 */
    .screen-area::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 13px;
      border: 2px solid transparent;
      background: linear-gradient(135deg, rgba(255,204,0,0.18), transparent, rgba(230,0,18,0.12)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .input-area, .preview-area {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .input-area textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      color: #f0ead8;
      font-family: "Courier New", Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }
    .input-area textarea:focus {
      box-shadow: inset 0 0 12px rgba(255,204,0,0.12);
    }
    .input-area textarea::placeholder {
      color: #7a7a8a;
    }

    .input-area .rich-input {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      color: #f0ead8;
      font-size: 0.95rem;
      line-height: 1.7;
      overflow-y: auto;
      outline: none;
    }
    .input-area .rich-input:focus {
      box-shadow: inset 0 0 12px rgba(255,204,0,0.12);
    }

    .preview-box {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      overflow-y: auto;
      line-height: 1.7;
      font-size: 0.9rem;
      color: var(--text-light);
    }
    .preview-box:empty::after {
      content: '在输入框中输入 Markdown，此处将实时渲染预览';
      color: #7a8a9a;
      font-style: italic;
    }

    /* ===== 预览区富文本样式 ===== */
    .preview-box h1 { font-size: 1.6rem; margin: 14px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #2a3a5a; color: #ffcc00; }
    .preview-box h2 { font-size: 1.3rem; margin: 12px 0 6px; color: #ffcc00; }
    .preview-box h3 { font-size: 1.1rem; margin: 10px 0 4px; color: #ffcc00; }
    .preview-box h4, .preview-box h5, .preview-box h6 { margin: 8px 0 4px; color: #ffcc00; }
    .preview-box p { margin: 6px 0; }
    .preview-box a { color: #ff5257; text-decoration: underline; }
    .preview-box strong { color: #fff; font-weight: 700; }
    .preview-box em { font-style: italic; color: #c0c0d0; }
    .preview-box code {
      background: #1a1a2e;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: "Courier New", Consolas, monospace;
      font-size: 0.8rem;
      color: #f0c0a0;
    }
    .preview-box pre {
      background: #08080e;
      border: 1px solid #1a2a4a;
      border-radius: 6px;
      padding: 12px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .preview-box pre code { background: none; padding: 0; font-size: 0.8rem; color: #c8d6e5; }
    .preview-box ul, .preview-box ol { margin: 6px 0; padding-left: 22px; }
    .preview-box li { margin: 2px 0; }
    .preview-box hr { border: none; border-top: 1px solid #2a3a5a; margin: 12px 0; }
    .preview-box blockquote {
      border-left: 3px solid #ffcc00;
      padding-left: 12px;
      margin: 8px 0;
      color: #a0a0b0;
      font-style: italic;
    }
    .preview-box img { max-width: 100%; border-radius: 4px; }
    .preview-box table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 0.85rem;
    }
    .preview-box thead { background: #1a1a2e; }
    .preview-box th {
      padding: 6px 10px;
      text-align: left;
      font-weight: 700;
      border: 1px solid #1a2a4a;
      color: #ffcc00;
    }
    .preview-box td {
      padding: 6px 10px;
      border: 1px solid #1a1a2e;
      vertical-align: top;
    }
    .preview-box tbody tr:nth-child(even) { background: rgba(20,20,40,0.3); }
    .preview-box tbody tr:hover { background: rgba(255,204,0,0.08); }

    /* ===== 控制区（按钮） ===== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 0;
    }

    .btn {
      font-family: var(--pixel);
      font-size: 0.45rem;
      letter-spacing: 1px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: none !important;
    }

    .dir-btn {
      width: 48px;
      height: 48px;
      background: var(--btn-gold);
      color: #1a1a1a;
      font-size: 1.1rem;
      box-shadow: 0 4px 0 var(--btn-gold-shadow), 0 6px 10px rgba(0,0,0,0.3);
    }
    .dir-btn:hover { background: #ffd633; }

    .copy-btn {
      height: 48px;
      padding: 0 20px;
      border-radius: 24px;
      background: var(--btn-a);
      color: #fff;
      box-shadow: 0 4px 0 var(--btn-a-shadow), 0 6px 10px rgba(0,0,0,0.3);
      font-size: 0.45rem;
      border: none;
      cursor: pointer;
      font-family: var(--pixel);
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .copy-btn:hover { background: #ff2d55; }
    .copy-btn:active { transform: translateY(2px); box-shadow: none !important; }
    .copy-btn.copied {
      background: #34c759 !important;
      box-shadow: 0 4px 0 #249d46, 0 6px 10px rgba(0,0,0,0.3) !important;
      pointer-events: none;
    }

    .clear-btn {
      width: 48px;
      height: 48px;
      background: #555;
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 4px 0 #333, 0 6px 10px rgba(0,0,0,0.3);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-family: var(--pixel);
      transition: transform 0.1s, box-shadow 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .clear-btn:hover { background: #666; }
    .clear-btn:active { transform: translateY(2px); box-shadow: none !important; }

    .btn-icon {
      width: 48px;
      height: 48px;
      background: #555;
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 4px 0 #333, 0 6px 10px rgba(0,0,0,0.3);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-family: var(--pixel);
      transition: transform 0.1s, box-shadow 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon:hover { background: #666; }
    .btn-icon:active { transform: translateY(2px); box-shadow: none !important; }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #34c759;
      color: #fff;
      font-family: var(--pixel);
      font-size: 0.4rem;
      padding: 10px 20px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 100;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(52,199,89,0.4);
    }
    .toast.show { opacity: 1; }

    /* ===== 焦点环 ===== */
    .btn:focus-visible,
    .copy-btn:focus-visible,
    .clear-btn:focus-visible,
    .dir-btn:focus-visible,
    .btn-icon:focus-visible {
      outline: 3px solid #1a1a1a;
      outline-offset: 2px;
    }
    textarea:focus-visible,
    .rich-input:focus-visible {
      outline: 3px solid var(--screen-glow);
      outline-offset: 2px;
    }

    /* ===== 减少动效 ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    /* ===== 计分板 ===== */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      padding: 8px 12px;
      background: var(--screen-bg);
      border: 2px solid #3a3a4a;
      border-radius: 8px;
      font-family: var(--pixel);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.42rem;
      color: var(--text-dim);
      letter-spacing: 2px;
    }
    .stat-value {
      font-size: 0.7rem;
      color: #ffcc00;
      text-shadow: 0 0 6px rgba(255,204,0,0.4);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 640px) {
      body { padding: 8px; }
      .console { padding: 12px; border-radius: 20px; }
      .header h1 { font-size: 0.65rem; }
      .input-area textarea { min-height: 120px; font-size: 0.75rem; }
      .preview-box { min-height: 120px; font-size: 0.8rem; }
      .copy-btn { height: 44px; padding: 0 14px; font-size: 0.4rem; }
      .dir-btn, .clear-btn, .btn-icon { width: 44px; height: 44px; font-size: 0.85rem; }
      .toolbar { gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="console">
    <div class="header">
      <span class="badge">FC</span>
      <h1>RETRO CONVERTER</h1>
      <span class="subtitle">红白机 · 像素转换机</span>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="container">
      <div class="screen-area">
        <div class="screen-label" id="inputLabel">MD INPUT</div>
        <div class="input-area">
          <textarea id="input" aria-labelledby="inputLabel" placeholder="在此粘贴或输入 Markdown 内容…

# 标题
**粗体** *斜体* ~~删除线~~
[链接](https://example.com)
- 列表项
```js
// 代码块
console.log('hello');
```"></textarea>
          <div id="richInput" class="rich-input" contenteditable role="textbox" aria-multiline="true" aria-labelledby="inputLabel" style="display:none"></div>
        </div>
      </div>

      <div class="toolbar">
        <button class="dir-btn" id="dirBtn" aria-label="切换输入方向">⇄</button>
        <button class="copy-btn" id="copyBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制
        </button>
        <button class="clear-btn" id="clearBtn" aria-label="清空">✕</button>
      </div>

      <div class="screen-area">
        <div class="screen-label" id="previewLabel">PREVIEW</div>
        <div class="preview-area">
          <div class="preview-box" id="preview"></div>
        </div>
      </div>
    </div>

    <div class="stats-bar" id="statsBar">
      <span class="stat-item"><span class="stat-label">CHR</span><span class="stat-value" id="statChr">0</span></span>
      <span class="stat-item"><span class="stat-label">CHR/SP</span><span class="stat-value" id="statChrSp">0</span></span>
      <span class="stat-item"><span class="stat-label">WRD</span><span class="stat-value" id="statWrd">0</span></span>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const richInput = document.getElementById('richInput');
    const preview = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const dirBtn = document.getElementById('dirBtn');
    const toast = document.getElementById('toast');
    const inputLabel = document.getElementById('inputLabel');
    const previewLabel = document.getElementById('previewLabel');
    const statChr = document.getElementById('statChr');
    const statChrSp = document.getElementById('statChrSp');
    const statWrd = document.getElementById('statWrd');

    /* ============ Markdown 解析器（使用 marked.js） ============ */

    function convert(text) {
      if (!text.trim()) return '';
      return marked.parse(text, { gfm: true });
    }

    /* ============ 实时渲染 ============ */

    let isReverse = false;
    const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });

    function render() {
      if (isReverse) {
        const md = turndownService.turndown(richInput.innerHTML);
        preview.innerHTML = '<pre><code>' + md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code></pre>';
      } else {
        preview.innerHTML = convert(input.value);
      }
      updateStats();
    }

    input.addEventListener('input', render);
    richInput.addEventListener('input', render);
    render();

    /* ============ 统计 ============ */

    function updateStats() {
      // 统计当前可见/可编辑的输入源：正向取 Markdown，反向取富文本
      const text = (isReverse ? richInput.textContent : input.value) || '';
      const chrWith = text.length;
      const chrWithout = text.replace(/\s/g, '').length;
      // 中文逐字计数 + 英文/数字按词计数
      const cjk = text.match(/[一-鿿㐀-䶿]/g) || [];
      const latin = text.replace(/[一-鿿㐀-䶿]/g, ' ').match(/[A-Za-z0-9_]+/g) || [];
      const words = cjk.length + latin.length;
      statChr.textContent = chrWithout;
      statChrSp.textContent = chrWith;
      statWrd.textContent = words;
    }

    /* ============ 方向切换 ============ */

    dirBtn.addEventListener('click', () => {
      isReverse = !isReverse;
      if (isReverse) {
        input.style.display = 'none';
        richInput.innerHTML = marked.parse(input.value || '', { gfm: true });
        richInput.style.display = 'block';
        inputLabel.textContent = 'RICH INPUT';
        previewLabel.textContent = 'MD SOURCE';
        dirBtn.textContent = 'MD';
      } else {
        richInput.style.display = 'none';
        input.value = turndownService.turndown(richInput.innerHTML);
        input.style.display = '';
        inputLabel.textContent = 'MD INPUT';
        previewLabel.textContent = 'PREVIEW';
        dirBtn.textContent = '⇄';
      }
      render();
    });

    /* ============ 清屏 ============ */

    clearBtn.addEventListener('click', () => {
      input.value = '';
      richInput.innerHTML = '';
      preview.innerHTML = '';
      inputLabel.textContent = 'MD INPUT';
      previewLabel.textContent = 'PREVIEW';
      if (isReverse) {
        isReverse = false;
        richInput.style.display = 'none';
        input.style.display = '';
        dirBtn.textContent = '⇄';
      }
      updateStats();
    });

    /* ============ 复制：清洗 HTML + 生成纯文本 ============ */

    function buildCleanHTML(html) {
      const div = document.createElement('div');
      div.innerHTML = html;

      div.querySelectorAll('table').forEach(table => {
        table.setAttribute('border', '1');
        table.setAttribute('cellspacing', '0');
        table.setAttribute('cellpadding', '4');
        table.style.borderCollapse = 'collapse';
        table.style.border = '1px solid #aaa';
        table.style.margin = '10px 0';
      });
      div.querySelectorAll('th').forEach(th => {
        th.style.border = '1px solid #aaa';
        th.style.padding = '4px 8px';
        th.style.fontWeight = 'bold';
        th.style.textAlign = th.style.textAlign || 'left';
      });
      div.querySelectorAll('td').forEach(td => {
        td.style.border = '1px solid #aaa';
        td.style.padding = '4px 8px';
        td.style.verticalAlign = 'top';
      });

      div.querySelectorAll('code, pre').forEach(el => {
        el.style.fontFamily = 'Consolas, "Courier New", monospace';
      });

      return div.innerHTML;
    }

    function buildPlainText(html) {
      const div = document.createElement('div');
      div.innerHTML = html;

      div.querySelectorAll('table').forEach(table => {
        const lines = [];
        table.querySelectorAll('tr').forEach((row, ri) => {
          const cells = [...row.querySelectorAll('th, td')].map(c => c.textContent.trim());
          if (cells.length) lines.push(cells.join('\t'));
          if (ri === 0 && row.closest('thead')) {
            lines.push(cells.map(() => '---').join('\t'));
          }
        });
        const textNode = document.createTextNode('\n' + lines.join('\n') + '\n');
        table.replaceWith(textNode);
      });

      div.querySelectorAll('ol').forEach(ol => {
        ol.querySelectorAll(':scope > li').forEach((li, i) => {
          li.prepend(`${i + 1}. `);
        });
      });
      div.querySelectorAll('ul > li').forEach(li => {
        li.prepend('• ');
      });

      div.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, pre, blockquote, ul, ol').forEach(el => {
        el.append('\n');
      });

      let text = div.textContent || '';
      text = text.replace(/[ \t]+\n/g, '\n');
      text = text.replace(/\n{3,}/g, '\n\n');
      return text.trim();
    }

    /* ============ 复制富文本 ============ */

    copyBtn.addEventListener('click', async () => {
      if (isReverse) {
        const mdText = preview.textContent || '';
        if (!mdText.trim()) return;
        try {
          await navigator.clipboard.writeText(mdText);
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> OK!';
          showToast('Markdown 源码已复制');
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 复制';
          }, 2000);
        } catch { showToast('复制失败'); }
        return;
      }

      const rawHTML = preview.innerHTML;
      if (!rawHTML.trim()) return;

      const cleanHTML = buildCleanHTML(rawHTML);
      const plainText = buildPlainText(rawHTML);

      try {
        const item = new ClipboardItem({
          'text/html': new Blob([cleanHTML], { type: 'text/html' }),
          'text/plain': new Blob([plainText], { type: 'text/plain' })
        });
        await navigator.clipboard.write([item]);

        copyBtn.classList.add('copied');
        copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> OK!';
        showToast('富文本已复制到剪贴板');

        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 复制';
        }, 2000);
      } catch {
        try {
          await navigator.clipboard.writeText(plainText);
          showToast('已复制纯文本内容（含表格对齐）');
        } catch {
          showToast('复制失败，请手动选择预览区内容');
        }
      }
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    const TEST_MARKDOWN = [
      '# 标题1',
      '## 标题2',
      '**粗体** *斜体* ~~删除线~~ `行内代码`',
      '- 无序列表',
      '1. 有序列表',
      '> 引用',
      '\x60\x60\x60js',
      "console.log('code block')",
      '\x60\x60\x60',
      '[链接](https://example.com)',
      '![图片alt](https://picsum.photos/200)',
      '| 列A | 列B |',
      '| --- | --- |',
      '| 单元格 | 单元格 |',
      '---',
    ].join('\n');
  </script>
