<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Converter · 像素转换机</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown/dist/turndown.js"></script>
  <style>
    /* ============ 设计变量（掌机配色） ============ */
    :root {
      --shell: #F6EFE6;          /* 掌机外壳 米白 */
      --shell-border: #ded2c0;
      --screen-bg: #1A1B1E;      /* 屏幕 深空灰 */
      --pane-bg: #101114;        /* 面板 更深灰 */
      --btn-red: #c62a2a;        /* 红色 AB 键主色 */
      --text-dark: #3d3a35;
      --text-dim: #8a8070;
      --text-on-dark: #f2f2f2;
      --accent: #e8b04b;
      --pixel: 'Press Start 2P', 'Courier New', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(160deg, #e7dfd2, #d3c9b8);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* ============ 掌机外壳 ============ */
    .console {
      max-width: 1000px;
      width: 100%;
      background: var(--shell);
      border-radius: 32px;
      padding: 22px 24px 16px;
      border: 1px solid var(--shell-border);
      box-shadow:
        0 24px 60px rgba(60, 50, 35, 0.25),
        inset 0 2px 0 rgba(255, 255, 255, 0.85),
        inset 0 -4px 8px rgba(120, 100, 70, 0.08);
    }

    /* ============ 标题区 ============ */
    .header {
      text-align: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e7ddcd;
    }
    .header .badge {
      display: inline-block;
      font-family: var(--pixel);
      font-size: 0.6rem; /* FC 徽章 */
      color: #fff;
      background: var(--btn-red);
      border-radius: 6px;
      padding: 4px 8px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      box-shadow: 0 3px 0 #7f1515;
    }
    .header h1 {
      font-family: var(--pixel);
      font-size: 1.25rem; /* 顶部大标题 */
      color: var(--text-dark);
      letter-spacing: 2px;
      line-height: 1.5;
    }
    .header .subtitle {
      font-family: var(--pixel);
      font-size: 1rem; /* 标题下副标题 */
      color: var(--text-dim);
      letter-spacing: 3px;
      display: block;
      margin-top: 6px;
    }

    /* ---------- Claude 小宠物 ---------- */
    .claude-pet {
      position: relative;
      width: 90px;
      height: 60px;
      margin: 8px auto 0;
      cursor: pointer;
      user-select: none;
    }
    /* 来回滑动的载体（沿轨道左右移动） */
    .pet-slide {
      position: absolute;
      bottom: 2px;
      left: 50%;
      width: 54px;
      margin-left: -27px;
      animation: petSlide 4.5s ease-in-out infinite;
    }
    /* 轨道线 */
    .pet-line {
      position: absolute;
      bottom: 1px;
      left: 4px;
      right: 4px;
      height: 3px;
      border-radius: 2px;
      background: rgba(232, 137, 58, 0.5);
    }
    .pet-star {
      display: block;
      width: 54px;
      height: 54px;
      animation: petBounce 0.9s ease-in-out infinite;
    }
    .pet-pupil {
      animation: petBlink 4.5s infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes petSlide {
      0%, 100% { transform: translateX(-16px); }
      50% { transform: translateX(16px); }
    }
    @keyframes petBounce {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-6px); }
      55% { transform: translateY(-6px); }
      72% { transform: translateY(-1px); }
    }
    @keyframes petBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.1); }
    }
    .claude-pet.poked .pet-star { animation: petJump 0.5s ease; }
    @keyframes petJump {
      0% { transform: translateY(0); }
      30% { transform: translateY(-14px) rotate(-10deg); }
      60% { transform: translateY(0) rotate(8deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    .pet-bubble {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: #202226;
      color: #fff;
      font-size: 0.72rem;
      line-height: 1.4;
      padding: 6px 10px;
      border-radius: 10px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 150;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .pet-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #202226;
    }
    .pet-bubble.show { opacity: 1; }

    /* ============ 提示条 ============ */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #202226;
      color: #fff;
      font-size: 0.9rem; /* 提示条文字 */
      padding: 10px 20px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .toast.show { opacity: 1; }

    /* ============ 屏幕区（固定高度，内部滚动） ============ */
    .screen {
      background: var(--screen-bg);
      border-radius: 18px;
      padding: 12px;
      height: clamp(260px, 56vh, 520px);
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
    }
    .screen-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 10px;
      flex-shrink: 0;
    }
    .screen-title {
      font-family: var(--pixel);
      font-size: 0.55rem; /* 屏幕顶部 FORMAT 标签 */
      color: #8a8f98;
      letter-spacing: 2px;
    }
    #formatLabel {
      font-family: var(--pixel);
      font-size: 0.55rem; /* 当前格式显示 */
      color: var(--accent);
      letter-spacing: 1px;
    }

    /* 双栏：左输入 / 右预览 */
    .screen-body {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 10px;
    }
    .pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .pane-label {
      font-family: var(--pixel);
      font-size: 0.55rem; /* 面板标签(MD INPUT/PREVIEW) */
      color: #8a8f98;
      letter-spacing: 2px;
      margin-bottom: 6px;
      padding: 0 2px;
      flex-shrink: 0;
    }

    textarea, .rich-input, .preview-box {
      flex: 1;
      min-height: 0;
      border: none;
      border-radius: 12px;
      background: var(--pane-bg);
      color: var(--text-on-dark);
      padding: 12px 14px;
      font-size: 1rem; /* 输入框 / 预览区正文 */
      line-height: 1.6;
      outline: none;
      overflow-y: auto;
    }
    textarea {
      resize: none;
      font-family: "Courier New", Consolas, monospace;
    }
    textarea::placeholder { color: #5a5e66; }
    textarea:focus-visible, .rich-input:focus-visible, .preview-box:focus-visible {
      box-shadow: inset 0 0 0 2px rgba(232, 176, 75, 0.5);
    }
    .input-pane.dragging textarea,
    .input-pane.dragging .rich-input {
      box-shadow: inset 0 0 0 2px dashed #C62A2A;
    }

    /* ============ 预览区富文本排版 ============ */
    .preview-box:empty::after {
      content: '等待输入，此处实时显示转换结果';
      color: #5a5e66;
      font-style: italic;
      font-size: 0.9rem; /* 空态提示文字 */
    }
    .preview-box h1, .preview-box h2, .preview-box h3 { color: #fff; }
    .preview-box h1 { font-size: 1.6rem; /* 预览大标题 */ margin: 14px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #2c2f35; }
    .preview-box h2 { font-size: 1.35rem; /* 预览次级标题 */ margin: 12px 0 6px; }
    .preview-box h3 { font-size: 1.15rem; /* 预览小标题 */ margin: 10px 0 4px; }
    .preview-box h4, .preview-box h5, .preview-box h6 { margin: 8px 0 4px; color: #cfd3d9; }
    .preview-box p { margin: 6px 0; }
    .preview-box a { color: var(--accent); text-decoration: underline; }
    .preview-box strong { color: #fff; font-weight: 700; }
    .preview-box em { font-style: italic; color: #c8ccd2; }
    .preview-box code { background: #2a2c31; padding: 2px 6px; border-radius: 4px; font-family: "Courier New", Consolas, monospace; font-size: 0.85em; /* 行内代码(相对正文) */ color: #e8a55a; }
    .preview-box pre { background: #0b0c0e; border: 1px solid #2c2f35; border-radius: 8px; padding: 12px; overflow-x: auto; margin: 10px 0; }
    .preview-box pre code { background: none; padding: 0; font-size: 0.85em; /* 代码块(相对正文) */ color: #d0d4da; }
    .preview-box ul, .preview-box ol { margin: 6px 0; padding-left: 22px; }
    .preview-box li { margin: 2px 0; }
    .preview-box blockquote { border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0; color: #b6bac2; }
    .preview-box hr { border: none; border-top: 1px solid #33363c; margin: 12px 0; }
    .preview-box img { max-width: 100%; border-radius: 4px; }
    .preview-box table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.9em; /* 表格文字(相对正文) */ }
    .preview-box th { border: 1px solid #33363c; padding: 6px 10px; text-align: left; color: #fff; }
    .preview-box td { border: 1px solid #33363c; padding: 6px 10px; }
    .preview-box tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.04); }
    .preview-box tbody tr:hover { background: rgba(232, 176, 75, 0.06); }

    /* ======================================================
       掌机控制台（物理按键区）
       左：十字键 D-Pad   中下：3 个功能黑键   右：ABXY 红键菱形
       ====================================================== */
    .gamepad {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 18px 6px 6px;
    }

    /* ---------- 十字键 D-Pad（一体化 SVG 弧面十字 + 四个透明按压区） ---------- */
    .dpad {
      position: relative;
      width: 152px;
      height: 152px;
      flex-shrink: 0;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35)); /* 十字整体立体投影 */
    }
    .dpad-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* 三层：凹槽 well / 侧壁厚 thick / 顶面 face */
    .faceG, .thickG { transition: transform 0.06s; }
    .wellG { transform-origin: 60px 60px; }
    .thickG { transform: translate(1px, 3px); }
    .dpad-arm {
      position: absolute;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 1;
    }
    .dpad-arm.up    { top: 0; left: 48px; width: 56px; height: 72px; }
    .dpad-arm.down  { bottom: 0; left: 48px; width: 56px; height: 72px; }
    .dpad-arm.left  { left: 0; top: 48px; width: 72px; height: 56px; }
    .dpad-arm.right { right: 0; top: 48px; width: 72px; height: 56px; }
    .dpad-arm:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    /* 按压：顶面下沉 3px，侧壁厚度塌缩 */
    .dpad:has(.dpad-arm:active) .faceG { transform: translateY(3px); }
    .dpad:has(.dpad-arm:active) .thickG { transform: translate(1px, 0); }

    /* ---------- ABXY 红键（菱形排列，嵌在凹槽基座中） ---------- */
    .abxy {
      position: relative;
      width: 152px;
      height: 152px;
      flex-shrink: 0;
      border-radius: 24px;
      background: rgba(140, 118, 84, 0.06);
      box-shadow:
        inset 0 3px 8px rgba(90, 70, 40, 0.16),
        inset 0 -2px 4px rgba(255, 255, 255, 0.55);
    }
    /* 3D 立体按键三层：顶面 face + 侧壁厚度 thick + 底部凹槽 well（参考 Uiverse Z4drus） */
    .face {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 0.06s, border-radius 0.06s;
    }
    .thick {
      position: absolute;
      z-index: 1;
      top: 3px;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35);
      transition: transform 0.06s;
    }
    .well {
      position: absolute;
      z-index: 0;
      top: 0;
      left: -1px;
      width: calc(100% + 2px);
      height: calc(100% + 2px);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.12);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(255, 255, 255, 0.75);
      transition: border-radius 0.06s;
    }
    /* 按压：顶面下沉 3px，侧壁厚度随之塌缩 */
    .rkey:active .face { transform: translateY(3px); border-radius: 45%; }
    .rkey:active .thick { transform: translateY(-3px); }

    .rkey {
      position: absolute;
      width: 50px;
      height: 50px;
      border: none;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    .rkey .face {
      color: #fff;
      font-family: var(--pixel);
      font-size: 14px; /* 红键字母 A/B/X/Y */
      background: radial-gradient(circle at 38% 32%, #f05c5c, #c62a2a 60%, #9e1e1e);
      box-shadow: inset 3px 3px 6px rgba(255, 255, 255, 0.45), inset -3px -3px 5px rgba(0, 0, 0, 0.55);
    }
    .rkey .thick { background: radial-gradient(circle at 38% 32%, #d64545, #a32a2a 60%, #7d1b1b); }
    .rkey:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .rkey.top    { top: 6px; left: 50%; transform: translateX(-50%); }
    .rkey.bottom { bottom: 6px; left: 50%; transform: translateX(-50%); }
    .rkey.left   { left: 6px; top: 50%; transform: translateY(-50%); }
    .rkey.right  { right: 6px; top: 50%; transform: translateY(-50%); }

    /* ---------- 功能黑键（底部中间 3 个） ---------- */
    .gamepad-mid {
      position: relative;
      display: flex;
      gap: 22px;
      align-self: flex-end;
      padding-bottom: 14px;
    }
    .fnkey {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .fkey {
      width: 48px;
      height: 48px;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #4d4d4d, #222 55%, #111);
      box-shadow:
        inset 2px 2px 3px rgba(255, 255, 255, 0.15),
        inset -2px -2px 3px rgba(0, 0, 0, 0.5),
        0 4px 0 rgba(0, 0, 0, 0.4),
        0 8px 12px rgba(0, 0, 0, 0.2);
      transition: transform 0.06s, box-shadow 0.06s;
    }
    .fkey:active {
      transform: translateY(4px);
      box-shadow:
        inset 2px 2px 3px rgba(255, 255, 255, 0.15),
        inset -2px -2px 3px rgba(0, 0, 0, 0.5),
        0 0 0 rgba(0, 0, 0, 0.4),
        0 2px 4px rgba(0, 0, 0, 0.15);
    }
    .fkey:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .fkey-label {
      font-family: var(--pixel);
      font-size: 1rem; /* 功能键标签(格式切换/历史记录/设置) */
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    /* 历史记录下拉浮窗 */
    .hist-dropdown {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      background: #202226;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 100;
    }
    .hist-dropdown.open { display: block; }
    .hist-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: #e8e8e8;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem; /* 历史记录条目文字 */
    }
    .hist-item:hover { background: #2e3036; }
    .hist-summary { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-type { font-size: 0.7rem; /* 历史类型标签 */ color: var(--accent); }
    .hist-empty { color: #8a8f98; font-size: 0.85rem; /* 历史空态文字 */ padding: 8px 10px; }

    /* ============ 底部统计条 ============ */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px 0 0;
      border-top: 1px solid #e7ddcd;
      margin-top: 8px;
    }
    .stat-item { display: flex; align-items: center; gap: 6px; font-family: var(--pixel); }
    .stat-label { font-size: 0.8rem; /* 统计标签 */ color: var(--text-dim); letter-spacing: 1px; }
    .stat-value { font-size: 1rem; /* 统计数字 */ color: #a57a2a; }

    /* ============ 深色滚动条 ============ */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3c41; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4d53; }

    /* ============ 减少动效 ============ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    /* ============ 响应式 ============ */
    @media (max-width: 720px) {
      body { padding: 10px; }
      .console { padding: 14px 12px 12px; border-radius: 24px; }
      .screen { height: clamp(220px, 52vh, 420px); }
      .screen-body { flex-direction: column; }
      textarea, .rich-input, .preview-box { font-size: 0.9rem; } /* 手机端：正文 */
      .gamepad { padding-top: 14px; }
      .abxy { width: 120px; height: 120px; }
      .rkey { width: 42px; height: 42px; }
      .dpad { width: 120px; height: 120px; }
      .dpad-arm.up, .dpad-arm.down { left: 38px; width: 44px; height: 56px; }
      .dpad-arm.left, .dpad-arm.right { top: 38px; width: 56px; height: 44px; }
      .gamepad-mid { gap: 14px; }
      .fkey { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="console">
    <header class="header">
      <span class="badge">FC</span>
      <h1>RETRO CONVERTER</h1>
      <span class="subtitle">像素转换机</span>

      <!-- Claude 小宠物（星芒 + 气泡吐槽，沿轨道来回滑动） -->
      <div class="claude-pet" id="claudePet" title="点我">
        <div class="pet-slide">
          <div class="pet-bubble" id="petBubble" role="status"></div>
          <svg class="pet-star" viewBox="0 0 1024 1024" aria-hidden="true">
            <defs>
              <radialGradient id="petGrad" cx="35%" cy="30%" r="90%">
                <stop offset="0%" stop-color="#f7a55c"/>
                <stop offset="55%" stop-color="#ee8a3c"/>
                <stop offset="100%" stop-color="#c96822"/>
              </radialGradient>
            </defs>
            <path d="M174.2 156.2h54.1V436h-54.1zM752.688 269.016v54.1h-490.8v-54.1z" fill="url(#petGrad)"/>
            <path d="M228.3 212.2h54.1V380h-54.1z m-55 558.4h56v56h-56z m-109.1-56h56v56h-56z m0-110.7h56v56h-56z m0-112h56v56h-56z m558.2 0h56v56h-56z m0 112h56v56h-56z m-55.9-56h56v56h-56z m111.9 0h56v56h-56z m-393-0.6h167.7v56H285.4z" fill="url(#petGrad)"/>
            <path d="M397.193 491.455v167.7h-56v-167.7zM229.3 827.6h112.2v56H229.3zM120.2 380h54.1v390.6h-54.1zM847.73 436.004h-54.1v-279.8h54.1zM793.58 379.96h-54.1v-167.8h54.1zM848.63 826.472h-56v-56h56zM957.71 770.56h-56v-56h56zM957.71 659.77h-56v-56h56zM957.71 547.858h-56v-56h56zM792.672 883.532h-112.2v-56h112.2z" fill="url(#petGrad)"/>
            <path d="M901.78 770.548h-54.1v-390.6h54.1z" fill="url(#petGrad)"/>
            <!-- 眼睛 -->
            <circle cx="482" cy="496" r="14" fill="#fff"/>

      <span class="stat-item"><span class="stat-label">CHR</span><span class="stat-value" id="statChr">0</span></span>
      <span class="stat-item"><span class="stat-label">CHR/SP</span><span class="stat-value" id="statChrSp">0</span></span>
      <span class="stat-item"><span class="stat-label">WRD</span><span class="stat-value" id="statWrd">0</span></span>

  <script>
    /* ============ DOM 引用 ============ */
    const input = document.getElementById('input');
    const richInput = document.getElementById('richInput');
    const preview = document.getElementById('preview');
    const formatLabel = document.getElementById('formatLabel');
    const inputLabel = document.getElementById('inputLabel');
    const previewLabel = document.getElementById('previewLabel');
    const inputPane = document.getElementById('inputPane');
    const toast = document.getElementById('toast');
    const histDropdown = document.getElementById('histDropdown');
    const statChr = document.getElementById('statChr');
    const statChrSp = document.getElementById('statChrSp');
    const statWrd = document.getElementById('statWrd');

    const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
    const HISTORY_KEY = 'retroConverterHistory';
    const MAX_HISTORY = 5;

    /* ============ 转换格式注册表（新增格式在此加一项） ============ */
    const FORMATS = {
      md2html: {
        label: 'MD → HTML',
        inputLabel: 'MD INPUT',
        previewLabel: 'PREVIEW',
        source: () => input.value,
        setSource: (t) => { input.value = t; },
        render: (t) => marked.parse(t || '', { gfm: true }),
      },
      html2md: {
        label: 'HTML → MD',
        inputLabel: 'RICH INPUT',
        previewLabel: 'MD SOURCE',
        source: () => richInput.innerHTML,
        setSource: (t) => { richInput.innerHTML = marked.parse(t || '', { gfm: true }); },
        render: (h) => '<pre><code>' + escapeHtml(turndownService.turndown(h || '')) + '</code></pre>',
      },
    };

    let currentFormat = 'md2html';
    let histCursor = -1;

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    /* ============ 切换格式（同步两侧内容） ============ */
    function applyFormat(next) {
      if (next === currentFormat) return;
      if (next === 'md2html') {
        input.value = turndownService.turndown(richInput.innerHTML);
        richInput.style.display = 'none';
        input.style.display = '';
      } else {
        richInput.innerHTML = marked.parse(input.value || '', { gfm: true });
        input.style.display = 'none';
        richInput.style.display = '';
      }
      currentFormat = next;
      updateLabels();
      render();
    }

    function updateLabels() {
      formatLabel.textContent = FORMATS[currentFormat].label;
      inputLabel.textContent = FORMATS[currentFormat].inputLabel;
      previewLabel.textContent = FORMATS[currentFormat].previewLabel;
    }

    /* ============ 实时同步渲染 ============ */
    function render() {
      const fmt = FORMATS[currentFormat];
      preview.innerHTML = fmt.render(fmt.source());
      updateStats();
    }
    input.addEventListener('input', render);
    richInput.addEventListener('input', render);

    /* ============ 统计（CJK 逐字 + 英文按词） ============ */
    function updateStats() {
      const text = (currentFormat === 'html2md' ? richInput.textContent : input.value) || '';
      const chrWith = text.length;
      const chrWithout = text.replace(/\s/g, '').length;
      const cjk = text.match(/[一-鿿㐀-䶿]/g) || [];
      const latin = text.replace(/[一-鿿㐀-䶿]/g, ' ').match(/[A-Za-z0-9_]+/g) || [];
      statChr.textContent = chrWithout;
      statChrSp.textContent = chrWith;
      statWrd.textContent = cjk.length + latin.length;
    }

    /* ============ 历史记录（LocalStorage，最多 5 条） ============ */
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
      catch { return []; }
    }
    function saveHistory() {
      const fmt = FORMATS[currentFormat];
      const src = fmt.source();
      if (!src.trim()) return;
      const record = {
        id: Date.now(),
        time: new Date().toLocaleString(),
        type: currentFormat,
        typeLabel: fmt.label,
        summary: src.trim().slice(0, 28),
        input: src,
        result: preview.innerHTML,
      };
      const list = loadHistory();
      list.unshift(record);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, MAX_HISTORY)));
      renderHistory();
    }
    function applyRecord(rec) {
      if (rec.type !== currentFormat) applyFormat(rec.type);
      FORMATS[currentFormat].setSource(rec.input);
      render();
    }
    function renderHistory() {
      const list = loadHistory();
      histDropdown.innerHTML = '';
      if (!list.length) {
        histDropdown.innerHTML = '<div class="hist-empty">暂无记录</div>';
        return;
      }
      list.forEach(rec => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'hist-item';
        item.setAttribute('role', 'menuitem');
        item.innerHTML = '<span class="hist-type">' + escapeHtml(rec.typeLabel) + '</span>'
          + '<span class="hist-summary">' + escapeHtml(rec.summary) + '</span>';
        item.addEventListener('click', () => { applyRecord(rec); closeHistory(); showToast('已回填并转换'); });
        histDropdown.appendChild(item);
      });
    }
    function toggleHistory() {
      const open = histDropdown.classList.toggle('open');
      if (open) { renderHistory(); histCursor = -1; }
    }
    function closeHistory() { histDropdown.classList.remove('open'); }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.gamepad-mid')) closeHistory();
    });
    /* 十字键上下：历史导航 */
    function histNavigate(dir) {
      const list = loadHistory();
      if (!list.length) { showToast('暂无历史记录'); return; }
      const next = histCursor + dir;
      if (next < 0 || next >= list.length) { showToast(dir > 0 ? '已是最早一条' : '已是最新一条'); return; }
      histCursor = next;
      applyRecord(list[histCursor]);
      showToast('历史 ' + (histCursor + 1) + ' / ' + list.length);
    }

    /* ============ 音效（Web Audio 合成，无需音频文件） ============ */
    let soundOn = localStorage.getItem('retroSoundOn') !== 'off';
    let masterVol = 1.2; /* 总音量 0~1：想整体变大改大、变小改小（例如 0.5 / 1.0） */
    let audioCtx = null;
    function ensureCtx() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      } catch { return null; }
    }
    function tone(freq, dur, type, vol, delay) {
      if (!soundOn) return;
      const ctx = ensureCtx();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq;
        const t = ctx.currentTime + (delay || 0);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime((vol || 0.06) * masterVol, t + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.03);
      } catch {}
    }
    const SFX = {
      click:  () => tone(180, 0.05, 'square', 0.05),
      switch: () => { tone(520, 0.07, 'square', 0.06); tone(780, 0.09, 'square', 0.05, 0.06); },
      copy:   () => { tone(660, 0.06, 'triangle', 0.08); tone(880, 0.12, 'triangle', 0.08, 0.07); },
      clear:  () => { tone(360, 0.05, 'square', 0.05); tone(240, 0.08, 'square', 0.04, 0.05); },
      error:  () => tone(130, 0.16, 'sawtooth', 0.05),
      on:     () => { tone(520, 0.06, 'triangle', 0.08); tone(700, 0.08, 'triangle', 0.08, 0.06); },
    };
    function showError(msg) { SFX.error(); showToast(msg); }
    /* 所有掌机按键按下统一发出"咔哒"声 */
    document.querySelector('.gamepad').addEventListener('click', () => SFX.click());

    /* ============ Claude 小宠物（气泡吐槽） ============ */
    const pet = document.getElementById('claudePet');
    const petBubble = document.getElementById('petBubble');
    let petTimer = null;
    const PET = {
      idle:   ['看我干嘛，去写 Markdown 啊', '这页可真米白…', '再不动我就打盹了', '星芒也会累的', '盯——你码到哪了'],
      copy:   ['复制成功！快粘到 Word 去', '一手好活', '挺熟练啊', '学会了，下次我来'],
      clear:  ['清空，重新开始，真干脆', '字没了，有点空虚', '归零……'],
      switch: ['翻来翻去，累死星芒了', 'MD→HTML→MD，绕呢', '行吧，听你的'],
      poke:   ['哎哟！轻点戳', '你戳我干嘛', '这星芒是碳基的，会疼', '再戳我可要生气了'],
    };
    function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function petSay(text, hold) {
      petBubble.textContent = text;
      petBubble.classList.add('show');
      clearTimeout(petTimer);
      petTimer = setTimeout(() => petBubble.classList.remove('show'), hold || 2600);
    }
    /* 闲置吐槽：每 22 秒，若气泡没在显示就随机说一句 */
    setInterval(() => {
      if (!petBubble.classList.contains('show')) petSay(pickOne(PET.idle), 2400);
    }, 22000);
    /* 点击：弹跳 + 吐槽 */
    pet.addEventListener('click', () => {
      pet.classList.remove('poked');
      void pet.offsetWidth;
      pet.classList.add('poked');
      petSay(pickOne(PET.poke), 2000);
    });

    /* ============ 掌机按键绑定 ============ */
    document.getElementById('aKey').addEventListener('click', () => { saveHistory(); copyOutput(); });
    document.getElementById('bKey').addEventListener('click', clearAll);
    document.getElementById('xKey').addEventListener('click', () => showError('X 键预留'));
    document.getElementById('yKey').addEventListener('click', () => showError('Y 键预留'));
    document.querySelector('.dpad-arm.up').addEventListener('click', () => histNavigate(1));
    document.querySelector('.dpad-arm.down').addEventListener('click', () => histNavigate(-1));
    document.querySelector('.dpad-arm.left').addEventListener('click', () => showError('方向键左预留'));
    document.querySelector('.dpad-arm.right').addEventListener('click', () => showError('方向键右预留'));
    document.getElementById('fmtKey').addEventListener('click', () => {
      applyFormat(currentFormat === 'md2html' ? 'html2md' : 'md2html');
      SFX.switch();
      showToast('已切换：' + FORMATS[currentFormat].label);
      petSay(pickOne(PET.switch));
    });
    document.getElementById('histKey').addEventListener('click', (e) => { e.stopPropagation(); toggleHistory(); });
    document.getElementById('settingsKey').addEventListener('click', () => {
      soundOn = !soundOn;
      localStorage.setItem('retroSoundOn', soundOn ? 'on' : 'off');
      showToast(soundOn ? '音效已开启' : '音效已关闭');
      if (soundOn) SFX.on();
    });

    /* ============ 清空 ============ */
    function clearAll() {
      input.value = '';
      richInput.innerHTML = '';
      preview.innerHTML = '';
      updateStats();
      SFX.clear();
      showToast('已清空');
      petSay(pickOne(PET.clear));
    }

    /* ============ 拖拽文件（.md / .txt / .html） ============ */
    inputPane.addEventListener('dragover', (e) => { e.preventDefault(); inputPane.classList.add('dragging'); });
    inputPane.addEventListener('dragleave', () => inputPane.classList.remove('dragging'));
    inputPane.addEventListener('drop', (e) => {
      e.preventDefault();
      inputPane.classList.remove('dragging');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      if (!['md', 'txt', 'html'].includes(ext)) { showError('仅支持 .md / .txt / .html 文件'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => { FORMATS[currentFormat].setSource(ev.target.result); render(); showToast('已载入 ' + file.name); };
      reader.readAsText(file, 'utf-8');
    });

    /* ============ 复制 ============ */
    function buildCleanHTML(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      div.querySelectorAll('table').forEach(table => {
        table.setAttribute('border', '1');
        table.setAttribute('cellspacing', '0');
        table.setAttribute('cellpadding', '4');
        table.style.borderCollapse = 'collapse';
        table.style.border = '1px solid #aaa';
        table.style.margin = '10px 0';
      });
      div.querySelectorAll('th').forEach(th => {
        th.style.border = '1px solid #aaa';
        th.style.padding = '4px 8px';
        th.style.fontWeight = 'bold';
        th.style.textAlign = th.style.textAlign || 'left';
      });
      div.querySelectorAll('td').forEach(td => {
        td.style.border = '1px solid #aaa';
        td.style.padding = '4px 8px';
        td.style.verticalAlign = 'top';
      });
      div.querySelectorAll('code, pre').forEach(el => { el.style.fontFamily = 'Consolas, "Courier New", monospace'; });
      return div.innerHTML;
    }
    function buildPlainText(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      div.querySelectorAll('table').forEach(table => {
        const lines = [];
        table.querySelectorAll('tr').forEach((row, ri) => {
          const cells = [...row.querySelectorAll('th, td')].map(c => c.textContent.trim());
          if (cells.length) lines.push(cells.join('\t'));
          if (ri === 0 && row.closest('thead')) lines.push(cells.map(() => '---').join('\t'));
        });
        table.replaceWith(document.createTextNode('\n' + lines.join('\n') + '\n'));
      });
      div.querySelectorAll('ol').forEach(ol => {
        ol.querySelectorAll(':scope > li').forEach((li, i) => { li.prepend(i + 1 + '. '); });
      });
      div.querySelectorAll('ul > li').forEach(li => { li.prepend('• '); });
      div.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, pre, blockquote, ul, ol').forEach(el => { el.append('\n'); });
      let text = div.textContent || '';
      text = text.replace(/[ \t]+\n/g, '\n');
      text = text.replace(/\n{3,}/g, '\n\n');
      return text.trim();
    }
    async function copyOutput() {
      const rawHTML = preview.innerHTML;
      if (!rawHTML.trim()) { showError('没有可复制的内容'); return; }
      if (currentFormat === 'html2md') {
        const md = preview.textContent || '';
        try { await navigator.clipboard.writeText(md); SFX.copy(); petSay(pickOne(PET.copy)); showToast('Markdown 源码已复制'); }
        catch { showError('复制失败'); }
        return;
      }
      const cleanHTML = buildCleanHTML(rawHTML);
      const plainText = buildPlainText(rawHTML);
      try {
        const item = new ClipboardItem({
          'text/html': new Blob([cleanHTML], { type: 'text/html' }),
          'text/plain': new Blob([plainText], { type: 'text/plain' })
        });
        await navigator.clipboard.write([item]);
        SFX.copy();
        petSay(pickOne(PET.copy));
        showToast('富文本已复制到剪贴板');
      } catch {
        try { await navigator.clipboard.writeText(plainText); SFX.copy(); petSay(pickOne(PET.copy)); showToast('已复制纯文本（含表格对齐）'); }
        catch { showError('复制失败，请手动选择预览区'); }
      }
    }

    /* ============ Toast ============ */
    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    /* ============ 初始化 ============ */
    updateLabels();
    render();
    renderHistory();
  </script>
</body>
</html>
