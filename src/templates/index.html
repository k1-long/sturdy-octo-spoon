<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown → Word 转换器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Markdown → Word</h1>
            <p class="subtitle">编写 Markdown，实时预览，一键导出 .docx 文档</p>
        </header>

        <!-- 编辑器 + 预览 -->
        <div class="editor-section">
            <div class="editor-pane">
                <div class="pane-header">
                    <span>Markdown 输入</span>
                    <button class="btn-import" id="importBtn">📂 导入文件</button>
                    <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>
                </div>
                <textarea id="markdownInput" placeholder="在此输入 Markdown 内容，右侧实时预览…

# 标题

**粗体** *斜体* `行内代码`

```python
def hello():
    print('Hello!')
```

- 列表项 1
- 列表项 2

| 列A | 列B |
|-----|-----|
| 值1 | 值2 |"></textarea>
            </div>
            <div class="preview-pane">
                <div class="pane-header">
                    <span>实时预览</span>
                </div>
                <div class="preview-box" id="preview"></div>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="action-bar">
            <button class="btn btn-primary" id="convertBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                转换为 Word 文档
            </button>
            <div class="status-msg" id="statusMsg"></div>
        </div>

        <!-- 拖拽上传覆盖层 -->
        <div class="drop-overlay" id="dropOverlay">
            <div class="drop-content">
                <span class="drop-icon-large">📄</span>
                <span>拖放 .md 文件到此处</span>
            </div>
        </div>
    </div>

    <script>
        // ============ Markdown 解析器（自研，无第三方依赖） ============

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function parseInline(line) {
            const codes = [];
            line = line.replace(/`([^`]+)`/g, (_, code) => {
                codes.push(escapeHtml(code));
                return `\x00C${codes.length - 1}\x00`;
            });
            line = line.replace(/!\[([^\]]*)\]\(([^)\s]+(?:\s"[^"]*")?)\)/g, '<img src="$2" alt="$1">');
            line = line.replace(/\[([^\]]+)\]\(([^)\s]+(?:\s"[^"]*")?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            line = line.replace(/\*\*\*(?!\s)([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
            line = line.replace(/\*\*(?!\s)([^*]+)\*\*/g, '<strong>$1</strong>');
            line = line.replace(/\*(?!\s)([^*]+)\*/g, '<em>$1</em>');
            line = line.replace(/~~([^~]+)~~/g, '<del>$1</del>');
            line = line.replace(/\x00C(\d+)\x00/g, (_, i) => `<code>${codes[+i]}</code>`);
            return line;
        }

        function convert(text) {
            if (!text.trim()) return '';
            const lines = text.split('\n');
            const result = [];
            let inCodeBlock = false;
            let codeContent = [];
            let codeLang = '';
            let listType = null;

            const flushList = () => {
                if (listType) {
                    result.push(listType === 'ol' ? '</ol>' : '</ul>');
                    listType = null;
                }
            };

            for (let i = 0; i < lines.length; i++) {
                const raw = lines[i];
                if (/^```/.test(raw.trim())) {
                    if (!inCodeBlock) {
                        flushList();
                        codeLang = raw.trim().slice(3).trim();
                        inCodeBlock = true;
                        codeContent = [];
                    } else {
                        const langAttr = codeLang ? ` class="language-${escapeHtml(codeLang)}"` : '';
                        result.push(`<pre><code${langAttr}>${codeContent.join('\n')}</code></pre>`);
                        inCodeBlock = false;
                    }
                    continue;
                }
                if (inCodeBlock) {
                    codeContent.push(escapeHtml(raw));
                    continue;
                }
                const trimmed = raw.trim();
                if (!trimmed) { flushList(); continue; }

                const hMatch = trimmed.match(/^(#{1,6})\s+(.+)$/);
                if (hMatch) { flushList(); result.push(`<h${hMatch[1].length}>${parseInline(hMatch[2])}</h${hMatch[1].length}>`); continue; }

                if (isTableRow(trimmed) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
                    flushList();
                    const headerCells = parseTableCells(trimmed);
                    const alignments = parseTableAlignments(lines[i + 1]);
                    const bodyRows = [];
                    i += 2;
                    while (i < lines.length && isTableRow(lines[i].trim()) && !isTableSeparator(lines[i].trim())) {
                        bodyRows.push(parseTableCells(lines[i].trim()));
                        i++;
                    }
                    i--;
                    result.push(buildTable(headerCells, alignments, bodyRows));
                    continue;
                }

                if (!trimmed.includes('|') && /^[-*_]{3,}\s*$/.test(trimmed)) {
                    flushList(); result.push('<hr>'); continue;
                }
                if (/^>\s?(.*)/.test(trimmed)) {
                    flushList(); const q = trimmed.replace(/^>\s?/, '');
                    result.push(`<blockquote><p>${parseInline(q)}</p></blockquote>`); continue;
                }
                const ulMatch = trimmed.match(/^[-*+]\s+(.+)$/);
                if (ulMatch) {
                    if (listType !== 'ul') { flushList(); result.push('<ul>'); listType = 'ul'; }
                    result.push(`<li>${parseInline(ulMatch[1])}</li>`); continue;
                }
                const olMatch = trimmed.match(/^\d+\.\s+(.+)$/);
                if (olMatch) {
                    if (listType !== 'ol') { flushList(); result.push('<ol>'); listType = 'ol'; }
                    result.push(`<li>${parseInline(olMatch[1])}</li>`); continue;
                }
                flushList();
                result.push(`<p>${parseInline(trimmed)}</p>`);
            }
            flushList();
            if (inCodeBlock && codeContent.length) result.push(`<pre><code>${codeContent.join('\n')}</code></pre>`);
            return result.join('\n');
        }

        function isTableRow(line) { return line.includes('|'); }
        function isTableSeparator(line) { const t = line.trim(); return /^\|?[\s]*:?-{3,}:?[\s]*\|/.test(t) && t.includes('-'); }
        function parseTableCells(line) {
            return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => parseInline(c.trim()));
        }
        function parseTableAlignments(sep) {
            return sep.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => {
                const s = c.trim();
                if (s.startsWith(':') && s.endsWith(':')) return 'center';
                if (s.endsWith(':')) return 'right';
                return 'left';
            });
        }
        function buildTable(headers, alignments, rows) {
            let html = '<table><thead><tr>';
            for (let i = 0; i < headers.length; i++) {
                const al = alignments[i] ? ` style="text-align:${alignments[i]}"` : '';
                html += `<th${al}>${headers[i]}</th>`;
            }
            html += '</tr></thead><tbody>';
            for (const row of rows) {
                html += '<tr>';
                for (let i = 0; i < headers.length; i++) {
                    const al = alignments[i] ? ` style="text-align:${alignments[i]}"` : '';
                    html += `<td${al}>${row[i] || ''}</td>`;
                }
                html += '</tr>';
            }
            return html + '</tbody></table>';
        }

        // ============ 实时预览 ============

        const input = document.getElementById('markdownInput');
        const preview = document.getElementById('preview');
        const convertBtn = document.getElementById('convertBtn');
        const statusMsg = document.getElementById('statusMsg');

        input.addEventListener('input', () => { preview.innerHTML = convert(input.value); });
        preview.innerHTML = convert(input.value);

        // ============ AJAX 转换 ============

        convertBtn.addEventListener('click', async () => {
            const text = input.value.trim();
            if (!text) {
                setStatus('请输入 Markdown 内容', 'error');
                return;
            }

            setStatus('正在转换...', 'loading');
            convertBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('markdown_text', text);
                const res = await fetch('/convert', { method: 'POST', body: formData });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({ detail: '转换失败' }));
                    setStatus(err.detail || '转换失败', 'error');
                    convertBtn.disabled = false;
                    return;
                }

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'document.docx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                setStatus('下载成功', 'success');
            } catch {
                setStatus('网络错误，请重试', 'error');
            }
            convertBtn.disabled = false;
        });

        // ============ 导入文件 ============

        document.getElementById('importBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            input.value = await file.text();
            preview.innerHTML = convert(input.value);
            e.target.value = '';
        });

        // ============ 拖拽上传 ============

        const dropOverlay = document.getElementById('dropOverlay');
        let dragCounter = 0;

        document.addEventListener('dragover', (e) => {
            if (e.dataTransfer.files.length) {
                e.preventDefault();
            }
        });

        document.addEventListener('dragenter', (e) => {
            if (e.dataTransfer.files.length) {
                e.preventDefault();
                dragCounter++;
                dropOverlay.classList.add('visible');
            }
        });

        document.addEventListener('dragleave', (e) => {
            if (e.dataTransfer.files.length) {
                e.preventDefault();
                dragCounter--;
                if (dragCounter === 0) dropOverlay.classList.remove('visible');
            }
        });

        document.addEventListener('drop', async (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropOverlay.classList.remove('visible');
            const file = e.dataTransfer.files[0];
            if (file && file.name.match(/\.(md|markdown|txt)$/i)) {
                input.value = await file.text();
                preview.innerHTML = convert(input.value);
            }
        });

        // ============ 状态 ============

        function setStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = 'status-msg ' + type;
            if (type === 'success') {
                setTimeout(() => { statusMsg.className = 'status-msg'; }, 3000);
            }
        }
    </script>
</body>
</html>
